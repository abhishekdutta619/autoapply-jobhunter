<nav class="nav">
  <div class="nav__brand">
    <img
      class="nav__logo"
      [src]="themeService.theme() === 'dark' ? 'logo-icon-dark.png' : 'logo-icon-light.png'"
      alt="AutoApply JobHunter logo"
    />
    <div class="nav__wordmark">
      <div class="nav__wordmark-main">
        <span class="nav__wordmark-muted">Auto</span><span class="nav__wordmark-solid">Apply</span>
      </div>
      <div class="nav__wordmark-sub">JOB HUNTER</div>
    </div>
  </div>

  @if (authService.status() === 'authenticated') {
    <a routerLink="/pipeline" routerLinkActive="nav__link--active" class="nav__link">Pipeline</a>
    <a routerLink="/review" routerLinkActive="nav__link--active" class="nav__link">Review queue</a>
  }

  <button
    type="button"
    class="nav__theme-toggle"
    (click)="themeService.toggle()"
    [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
  >
    @if (themeService.theme() === 'dark') {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
      </svg>
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
      </svg>
    }
  </button>

  @if (authService.status() === 'authenticated' && authService.user(); as user) {
    <div class="nav__user">
      @if (user.avatarUrl) {
        <img class="nav__avatar" [src]="user.avatarUrl" [alt]="user.name ?? user.email" />
      } @else {
        <span class="nav__avatar nav__avatar--fallback">{{ (user.name ?? user.email ?? '?').charAt(0).toUpperCase() }}</span>
      }
      <button type="button" class="nav__logout" (click)="authService.logout()">Log out</button>
    </div>
  }
</nav>

<router-outlet />
